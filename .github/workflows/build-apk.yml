name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: apk-build-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      NPM_CONFIG_FUND: false
      NPM_CONFIG_AUDIT: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: |
          npm install --no-fund --no-audit

      - name: Validate Expo dependency graph
        run: |
          npx expo-doctor

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci --maxWorkers=2

      - name: Build EAS production APK
        id: build
        run: |
          BUILD_JSON=$(npx eas-cli@latest build --json --wait --profile=production --platform=android --non-interactive)
          echo "$BUILD_JSON"
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.builds[0].id // .id // .buildId // .build.id')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "Could not determine EAS build ID from output"
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Fetch build artifact
        run: |
          BUILD_VIEW=$(npx eas-cli@latest build:view "${{ steps.build.outputs.build_id }}" --json)
          echo "$BUILD_VIEW"
          ARTIFACT_URL=$(echo "$BUILD_VIEW" | jq -r '.artifacts[0].url // .artifacts.url // .url // .buildUrl // .artifacts[0].path // .path')
          if [ -z "$ARTIFACT_URL" ] || [ "$ARTIFACT_URL" = "null" ]; then
            echo "No artifact URL returned by EAS"
            exit 1
          fi
          echo "Downloading from: $ARTIFACT_URL"
          curl -fL -H "Authorization: Bearer $EXPO_TOKEN" "$ARTIFACT_URL" -o app-release.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-toolkit-production-apk
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30